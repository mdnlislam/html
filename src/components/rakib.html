<!DOCTYPE html>
<html>
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Media Example</title>
  <link rel="stylesheet" href="styles.css">
   <style>
    .topnav{
      display: flex;
      gap: 20px;
      background-color: beige;
      align-items: center;
    }
    .topnav a{
      text-decoration: none;
    }
    .dropdown_content a{
      display:block;
      /* color: white; */

    }
    .Dropdown{
      position: relative;
    }
    .dropdown_content{
      position: absolute;
      display: none;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      padding: 5px;
      background-color: bisque;
      

    }
    .Dropdown:hover .dropdown_content{
      display: block;
    }
    #Home{
      background-color: rgb(148, 212, 52);
      color: white;
      padding: 5px;
    }

    @media screen and (max-width: 600px) {
  .topnav a:not(:first-child), .dropdown, #dropbtn {
    display: none;
  }
  .topnav a {
    float: right;
    display: block;
  }
  .text{
    text-align: center;
  }
}

    
   </style>
   
     
 </head>
 <body>
      
   <div class="topnav">
    <a id="Home" href="#">Home</a>
    <a href="#">New</a>
    <a href="#">Contact</a>
    <div class="Dropdown">
      <a id="dropbtn" href="#">Dropdown</a>
      <div class="dropdown_content">
        <a href="#">Link 1</a>
        <a href="#">Link 2</a>
        <a href="#">Link 3</a>

      </div>

    </div>
    <a href="#">About</a>
   </div>

  <div class="text">

    <h2>Responsive topnav width
      Dropdown
    </h2>

    <p>Resize the browser window to see how it work.</p>
    <p>Hover over the windown to see how it work dropdown menu.</p>

  </div>


 </body>

</html>
