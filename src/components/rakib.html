<!DOCTYPE html>
<html>
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Media Example</title>
  <link rel="stylesheet" href="styles.css">
   <style>
      .dropbtn{
        background-color: green;
        color: white;
        padding: 10px;
        border: none;
        font-size: 16px;
        display: block;
        width: 100%;
        text-align: left;
        cursor: pointer;
      }
      .dropdown{
        position:relative ;
        display: inline-block;
        width: 200px;
      }
      .dropdown input[type="checkbox"] {
        display: none;
      }
      .dropdown_content{
        position: absolute;
        display: none;
        background-color: bisque;
        box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      }
      .dropdown_content a{
        color: black;
        padding: 12px 16px;
        text-decoration: none;
        display: block;

      }
      .dropdown_content a:hover{
             background-color: #f1f1f1;
      }

      .dropdown input[type="checkbox"]:checked ~ .dropdown_content{
        display: block;
      }

     

      






   </style>
   
     
 </head>
 <body>

  

    <div class="dropdown">
        <label class="dropbtn" for="dropdown-toggle">Dropdown</label>
        <input type="checkbox" id="dropdown-toggle">
     <div class="dropdown_content">
        <a href="#">Home</a>
       <div class="About">
        <label class="Aboutvtn" for="dropdown_About">About</label>
        <input type="checkbox" id="dropdown_About">

        <div class="About_contant">
          <a href="#">Line 1</a>
          <a href="#"> link 2</a>

          <a href="#"> link 3</a>

          <a href="#"> link 4</a>
          <a href="#"> link 5</a>


        </div>
       </div>
        <a href="#">Care</a>
        <a href="#">Help</a>


     </div>



    </div>

       
 </body>

</html>
