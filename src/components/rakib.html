<!DOCTYPE html>
<html>
 <head>
    <title>Static page layout</title>
 
     <style>
       body{
        background-color: pink;
       }  
       @media screen and (min-width:580px) {
           body {
            background-color: red;
           }
       }

     </style>
 </head>
 <body>
    <h2>Resize the browser window to see the effect</h2>
    <p>the mwdia query will only apply
      if the mwdia type is screen and the 
      viewport is 480px wide or wider
    </p>
 </body>

</html>
