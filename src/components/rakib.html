<!DOCTYPE html>
<html>
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Media Example</title>
  <link rel="stylesheet" href="styles.css">
   <style>
        .row{
          display: flex;
          justify-content: space-around;
        }
        .row_content a{
          text-decoration: none;
          font-size: 25px;
          /* background-color: aqua; */
          /* color: white; */
          padding: 7px;
        }

        @media screen and (max-width:600px) {
          .row{
            display: block;
            /* padding-top: 20px; */
            text-align: center;
            
          }
          .row_content{
            padding-top: 20px;
            border: 2px solid red;
            background-color: antiquewhite;
          }
           .text{
            text-align: center;
            color: blue;
           }

        }
    
   </style>
   
     
 </head>
 <body>
     <div class="text">
      <h2>Media Queries</h2>
      <p>Resize the browser window,up and down around 800px width</p>
     </div>
   
     <div class="row">

         <div class="row_content">
          <a href="#">Left</a>
         </div>
          
         <div class="row_content">
            <a href="#"> main content</a>
         </div>

         <div class="row_content">
          <a href="#">Right</a>

         </div>

     </div>


 </body>

</html>
