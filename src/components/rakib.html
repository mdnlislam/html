/* responsive */





/* responsive */





 .grid_container{
  display: grid;
  
  row-gap: 40px;
  grid-template-columns: auto auto auto;
  background-color:#2196F3 ;
  padding: 10px;
} 
 .grid_item{
  background-color:rgba(255, 255, 255, 0.8) ;
  border:1px solid rgba(0, 0, 0, 0.8) ;
  padding: 20px;
  font-size: 30px;
  text-align: center;
} 


@media(max-width:600px) {
 .grid_container{
  display: grid;
  grid-template-columns:  auto;
 }
 .grid_elements h1,p{
           text-align: center;
 }

  
 }

 @media (min-width:601px) {
  .grid_container{
    display: grid;
    grid-template-columns: auto auto;
  }
  .grid_elements{
    text-align: center;
  }
  
 }

 @media (min-width:781px) {
  .grid_container{
    display: grid;
    grid-template-columns: auto auto auto ;
  }
  
 }

  <div class="grid_elements">
    <h1>Grid Element</h1>
    <p>A Grid layout must have a parent
      element with the <em>display</em>
      property set to <em>grid</em> or
      <em>inline-grid</em>.
    </p>

    <p>Direct child element(s) of the grid 
      container automatically becomes grids item .
    </p>

    <div class="grid_container">
      <div class="grid_item">1</div>
